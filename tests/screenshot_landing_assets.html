<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Landing Assets Screenshot Harness</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #09090b; }
    iframe { border: none; width: 390px; height: 844px; display: block; }
  </style>
</head>
<body>
  <iframe id="dashFrame" src="about:blank"></iframe>
  <script>
    const params = new URLSearchParams(window.location.search);
    const screen = params.get('screen') || 'dashboard'; 
    const theme = params.get('theme') || 'dark';
    const testUid = 'test_landing_user_priya';

    const targetW = parseInt(params.get('width'), 10) || 390;
    const targetH = parseInt(params.get('height'), 10) || 844;
    const frame = document.getElementById('dashFrame');
    frame.style.width = targetW + 'px';
    frame.style.height = targetH + 'px';
    document.body.style.width = targetW + 'px';
    document.body.style.height = targetH + 'px';

    const nowIso = new Date().toISOString();

    const demoData = {
      expenses: [
        { id: 'exp_1', name: 'Whole Foods Grocery', amount: 1450, category: 'food', date: '2026-10-02' },
        { id: 'exp_2', name: 'Electric Bill', amount: 489, category: 'bills', date: '2026-10-05' },
        { id: 'exp_3', name: 'Metro Card Pass', amount: 350, category: 'transport', date: '2026-10-08' }
      ],
      income_entries: [
        { id: 'inc_open', amount: 11460, entry_date: '2026-10-01', type: 'opening' },
        { id: 'inc_salary', amount: 5080, entry_date: '2026-10-01', type: 'add' }
      ],
      income: 16540,
      budgets: {
        food: 5000,
        bills: 2500,
        transport: 1500,
        shopping: 3000,
        entertainment: 2000
      },
      settings: {
        currency: 'INR',
        darkMode: theme === 'dark',
        statCardModes: { income: 'percent', expenses: 'percent' }
      },
      goals: [
        {
          id: 'goal_1',
          user_id: testUid,
          name: 'Emergency Fund',
          target_amount: 50000,
          target_date: '2026-12-31',
          category: 'savings',
          color: '#10b981',
          icon: 'fa-shield-alt',
          notes: '6 months basic living buffer',
          created_at: nowIso,
          updated_at: nowIso
        },
        {
          id: 'goal_2',
          user_id: testUid,
          name: 'MacBook Air M3',
          target_amount: 95000,
          target_date: '2027-03-31',
          category: 'gadgets',
          color: '#3b82f6',
          icon: 'fa-laptop',
          notes: 'Upgrading primary workstation',
          created_at: nowIso,
          updated_at: nowIso
        }
      ],
      goal_deposits: [
        { id: 'dep_1', goal_id: 'goal_1', user_id: testUid, amount: 22500, deposit_date: '2026-10-03', notes: 'Initial seed' },
        { id: 'dep_2', goal_id: 'goal_2', user_id: testUid, amount: 38000, deposit_date: '2026-10-04', notes: 'Side gig bonus' }
      ],
      loans: [
        { id: 'loan_1', user_id: testUid, person_name: 'Rahul Sharma', direction: 'lent', kind: 'cash', principal: 5000, date: '2026-10-01', due_date: '2026-11-01', notes: 'Weekend trip share' },
        { id: 'loan_2', user_id: testUid, person_name: 'Priya Verma', direction: 'borrowed', kind: 'bank', principal: 2500, date: '2026-10-03', due_date: '2026-10-25', notes: 'Office team lunch advance' }
      ],
      loan_settlements: [],
      customCategories: [
        { id: 'cat_gym', name: 'Gym & Fitness', icon: 'fa-dumbbell', color: '#f59e0b', isCustom: true },
        { id: 'cat_inv', name: 'Investments', icon: 'fa-chart-line', color: '#8b5cf6', isCustom: true }
      ],
      hiddenBuiltins: []
    };

    try {
      localStorage.setItem('sb_auth', 'true');
      localStorage.setItem('sb_user_id', testUid);
      localStorage.setItem('sb_username', 'Priya S.');
      localStorage.setItem('ledgio_theme', theme);
      localStorage.setItem('sb_theme', theme);
      localStorage.setItem('smartBudgetData', JSON.stringify(demoData));
      localStorage.setItem('smartBudgetData_' + testUid, JSON.stringify(demoData));
    } catch (e) {}

    frame.onload = async () => {
      if (frame.src === 'about:blank' || frame.contentWindow.location.href === 'about:blank') return;
      const win = frame.contentWindow;
      const doc = frame.contentDocument;

      await new Promise(r => setTimeout(r, 600));

      // Marketing screenshots: hide every scrollbar inside the app
      const hideBars = doc.createElement('style');
      hideBars.textContent = 'html, body, * { scrollbar-width: none !important; } ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }';
      doc.head.appendChild(hideBars);

      if (win.__ledgio_setCurrentUserForTesting) {
        win.__ledgio_setCurrentUserForTesting({ id: testUid, email: 'priya@example.com' });
      }

      if (theme === 'light') {
        doc.documentElement.setAttribute('data-theme', 'light');
        doc.body.classList.remove('theme-dark');
        doc.body.classList.add('theme-light');
      } else {
        doc.documentElement.setAttribute('data-theme', 'dark');
        doc.body.classList.remove('theme-light');
        doc.body.classList.add('theme-dark');
      }

      // Update avatar / user names to Priya S.
      const userNameEls = doc.querySelectorAll('.user-name, #header-user-name, .profile-name, #header-subtitle-name');
      userNameEls.forEach(el => el.textContent = 'Priya S.');
      const subName = doc.getElementById('header-subtitle-name');
      if (subName) subName.textContent = 'Priya!';
      const headerTitle = doc.getElementById('header-title');
      if (headerTitle) headerTitle.textContent = 'Dashboard';
      const userInitials = doc.querySelectorAll('.user-avatar-initials');
      userInitials.forEach(el => el.textContent = 'PS');

      if (win.__ledgio_setReportsMonth) {
        win.__ledgio_setReportsMonth('2026-10');
      }

      if (screen === 'dashboard' || screen === 'stat-cards') {
        const dashNav = doc.querySelector('a[data-section="dashboard"]');
        if (dashNav) dashNav.click();
        await new Promise(r => setTimeout(r, 150));

        if (win.__ledgio_setSummaryCardMode) {
          win.__ledgio_setSummaryCardMode('income', 'percent');
          win.__ledgio_setSummaryCardMode('expenses', 'percent');
        }

        if (screen === 'stat-cards') {
          const statSection = doc.querySelector('.summary-cards-section, .stats-overview, .hero-metric-cards');
          if (statSection) statSection.scrollIntoView({ behavior: 'instant', block: 'start' });
        }
      } else if (screen === 'budgets') {
        const budgetNav = doc.querySelector('a[data-section="budget"]');
        if (budgetNav) budgetNav.click();
        await new Promise(r => setTimeout(r, 250));
      } else if (screen === 'expenses') {
        const expNav = doc.querySelector('a[data-section="expenses"]');
        if (expNav) expNav.click();
        await new Promise(r => setTimeout(r, 200));
      } else if (screen === 'goals') {
        const goalsNav = doc.querySelector('a[data-section="goals"]');
        if (goalsNav) goalsNav.click();
        await new Promise(r => setTimeout(r, 200));
        if (win.renderGoals) win.renderGoals();
      } else if (screen === 'loans') {
        const loansNav = doc.querySelector('a[data-section="loans"]');
        if (loansNav) loansNav.click();
        await new Promise(r => setTimeout(r, 200));
        if (win.renderLoans) win.renderLoans();
      } else if (screen === 'reports') {
        const reportsNav = doc.querySelector('a[data-section="reports"]');
        if (reportsNav) reportsNav.click();
        await new Promise(r => setTimeout(r, 250));
        if (win.renderSpendingChart) win.renderSpendingChart();
        if (win.renderTrendChart) win.renderTrendChart();
      } else if (screen === 'loan-modal') {
        const loansNav = doc.querySelector('a[data-section="loans"]');
        if (loansNav) loansNav.click();
        await new Promise(r => setTimeout(r, 200));
        if (win.openCreateLoanModal) {
          win.openCreateLoanModal();
        } else {
          doc.getElementById('open-create-loan-btn')?.click();
        }
        await new Promise(r => setTimeout(r, 200));
        const personInput = doc.getElementById('loan-person-input');
        if (personInput) personInput.value = 'Rohan Mehra';
        const principalInput = doc.getElementById('loan-principal-input');
        if (principalInput) principalInput.value = '3500';
      } else if (screen === 'categories') {
        const expNav = doc.querySelector('a[data-section="expenses"]');
        if (expNav) expNav.click();
        await new Promise(r => setTimeout(r, 200));
        if (win.openCustomCategoryModal) {
          win.openCustomCategoryModal();
        } else {
          doc.getElementById('open-custom-category-btn')?.click();
        }
        await new Promise(r => setTimeout(r, 200));
        const nameInput = doc.getElementById('custom-category-name-input');
        if (nameInput) nameInput.value = 'Gym & Fitness';
      }

      if (win.__ledgio_refreshUI) win.__ledgio_refreshUI();
      if (doc.activeElement && doc.activeElement.blur) doc.activeElement.blur();
      await new Promise(r => setTimeout(r, 350));
      window.__ready = true;
    };

    frame.src = '../dashboard.html';
  </script>
</body>
</html>
