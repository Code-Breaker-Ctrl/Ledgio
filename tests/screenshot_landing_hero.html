<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Hero Screenshot Harness</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    iframe { border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="heroFrame" src="about:blank"></iframe>
  <script>
    const params = new URLSearchParams(window.location.search);
    const theme = params.get('theme') || 'dark';
    const menu = params.get('menu') || '0';
    const targetW = parseInt(params.get('width'), 10) || 1440;
    const targetH = parseInt(params.get('height'), 10) || 900;
    const frame = document.getElementById('heroFrame');
    frame.style.width = targetW + 'px';
    frame.style.height = targetH + 'px';
    document.body.style.width = targetW + 'px';
    document.body.style.height = targetH + 'px';
    frame.src = `/index.html?theme=${theme}&menu=${menu}`;
  </script>
</body>
</html>
