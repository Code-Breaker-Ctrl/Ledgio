<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Study & Baseline Capture Harness</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #09090b; }
    iframe { border: none; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <iframe id="studyFrame" src="about:blank"></iframe>
  <script>
    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode') || 'dashboard'; // 'dashboard' or 'landing'
    const section = params.get('section') || 'top';
    const targetW = parseInt(params.get('width'), 10) || 390;
    const targetH = parseInt(params.get('height'), 10) || 844;
    const frame = document.getElementById('studyFrame');

    frame.style.width = targetW + 'px';
    frame.style.height = targetH + 'px';
    document.body.style.width = targetW + 'px';
    document.documentElement.style.width = targetW + 'px';

    const testUid = 'mobile_landing_study_uid';
    const sampleLedger = {
      expenses: [
        { id: 'exp_1', name: 'Whole Foods Market', amount: 1250, category: 'food', date: '2026-10-24' },
        { id: 'exp_2', name: 'Metro Recharge', amount: 45, category: 'transport', date: '2026-10-23' },
        { id: 'exp_3', name: 'Chai Tapri', amount: 20, category: 'food', date: '2026-10-22' },
        { id: 'exp_4', name: 'Netflix Subscription', amount: 649, category: 'entertainment', date: '2026-10-20' },
        { id: 'exp_5', name: 'Electricity Bill', amount: 1850, category: 'bills', date: '2026-10-18' }
      ],
      income_entries: [
        { id: 'inc_1', amount: 50000, entry_date: '2026-10-01', type: 'salary', note: 'Monthly Salary' },
        { id: 'inc_2', amount: 2000, entry_date: '2026-10-15', type: 'add', note: 'Freelance Design' }
      ],
      income: 52000,
      budgets: { 'food': 5000, 'bills': 4000, 'transport': 800 },
      settings: {
        currency: 'INR',
        darkMode: true,
        statCardModes: { income: 'number', expenses: 'number' }
      },
      goals: [
        { id: 'goal_1', name: 'Emergency Fund', target_amount: 100000, color: '#10b981', icon: 'fa-shield-halved', deadline: '2026-12-31' }
      ],
      goal_deposits: [
        { id: 'dep_1', goal_id: 'goal_1', amount: 50000, deposit_date: '2026-10-15', note: 'Monthly saving' }
      ],
      loans: [
        { id: 'loan_1', person_name: 'Rahul Sharma', direction: 'lent', kind: 'cash', principal: 12500, date: '2026-10-05', note: 'Trip advance' },
        { id: 'loan_2', person_name: 'Priya Verma', direction: 'borrowed', kind: 'cash', principal: 3000, date: '2026-10-10', note: 'Dinner split' }
      ],
      loan_settlements: [
        { id: 'set_1', loan_id: 'loan_1', amount: 2500, settle_date: '2026-10-20', note: 'First instalment' }
      ]
    };

    if (mode === 'dashboard') {
      localStorage.setItem('sb_auth', 'true');
      localStorage.setItem('sb_user_id', testUid);
      localStorage.setItem('sb_username', 'Aman Joshi');
      localStorage.setItem('smartBudgetData', JSON.stringify(sampleLedger));
      localStorage.setItem('smartBudgetData_' + testUid, JSON.stringify(sampleLedger));
      localStorage.setItem('ledgio_income_entries_' + testUid, JSON.stringify(sampleLedger.income_entries));

      frame.onload = async () => {
        if (frame.src === 'about:blank' || frame.contentWindow.location.href === 'about:blank') return;
        const win = frame.contentWindow;
        const doc = frame.contentDocument;

        await new Promise(r => setTimeout(r, 600));

        if (win.__ledgio_setCurrentUserForTesting) {
          win.__ledgio_setCurrentUserForTesting({ id: testUid, email: 'aman@example.com' });
        }

        doc.documentElement.setAttribute('data-theme', 'dark');
        doc.body.classList.remove('theme-light');
        doc.body.classList.add('theme-dark');

        if (win.refreshUI) win.refreshUI();
        if (win.renderStats) win.renderStats();

        await new Promise(r => setTimeout(r, 400));

        if (section === 'loans') {
          const lk = doc.querySelector('a[data-section="loans"]');
          if (lk) lk.click();
          else if (win.navigateTo) win.navigateTo('loans');
        } else if (section === 'goals') {
          const gk = doc.querySelector('a[data-section="goals"]');
          if (gk) gk.click();
          else if (win.navigateTo) win.navigateTo('goals');
        } else {
          const dk = doc.querySelector('a[data-section="dashboard"]');
          if (dk) dk.click();
          else if (win.navigateTo) win.navigateTo('dashboard');
        }

        await new Promise(r => setTimeout(r, 400));
        window.__ready = true;
      };

      frame.src = '/dashboard.html?t=' + Date.now();
    } else {
      localStorage.removeItem('sb_auth');
      localStorage.removeItem('sb_user_id');

      frame.onload = async () => {
        if (frame.src === 'about:blank' || frame.contentWindow.location.href === 'about:blank') return;
        const win = frame.contentWindow;
        const doc = frame.contentDocument;

        await new Promise(r => setTimeout(r, 600));

        // Stop background timers from racing during screenshot capture
        if (typeof win.__ledgio_teardownLandingMobile === 'function') {
          win.__ledgio_teardownLandingMobile();
        }

        function setSlide(slideIdx) {
          const track = doc.getElementById('mob-motion-track');
          if (track) track.style.transform = `translateX(-${slideIdx * 100}%)`;
          const dots = doc.querySelectorAll('#mob-motion-dots .mob-dot');
          dots.forEach((d, i) => d.classList.toggle('active', i === slideIdx));
          const ind = doc.getElementById('mob-scene-indicator');
          if (ind) ind.textContent = `SCENE ${slideIdx + 1} OF 4`;
          const titles = ['Add an Expense', 'Instant Budget Limits', 'Visual Goal Progress', 'Swipe-to-Repay Loans'];
          const tEl = doc.getElementById('mob-scene-title-active');
          if (tEl) tEl.textContent = titles[slideIdx];
        }

        // Section state setup
        if (section === 'hero') {
          win.scrollTo(0, 0);
          doc.querySelectorAll('.mobile-bottom-tabs .mobile-tab-btn').forEach(b => b.classList.remove('active'));
          const tb = doc.querySelector('.mobile-bottom-tabs a[data-tab="hero"]');
          if (tb) tb.classList.add('active');

        // Scene 1
        } else if (section === 'scene1_start') {
          const el = doc.getElementById('motion');
          if (el) el.scrollIntoView({ behavior: 'instant', block: 'start' });
          setSlide(0);
          const sheet = doc.getElementById('mob-s1-sheet');
          if (sheet) sheet.classList.remove('is-open');
          const toast = doc.getElementById('mob-s1-toast');
          if (toast) toast.classList.remove('is-visible');
          const amt = doc.getElementById('mob-s1-amount');
          if (amt) amt.textContent = '₹0';
          const safe = doc.getElementById('mob-s1-safe');
          if (safe) safe.textContent = 'Safe: ₹37,550';
        } else if (section === 'scene1_mid') {
          const el = doc.getElementById('motion');
          if (el) el.scrollIntoView({ behavior: 'instant', block: 'start' });
          setSlide(0);
          const sheet = doc.getElementById('mob-s1-sheet');
          if (sheet) sheet.classList.add('is-open');
          const amt = doc.getElementById('mob-s1-amount');
          if (amt) amt.textContent = '₹1,200';
          const fab = doc.getElementById('mob-s1-fab');
          if (fab) fab.classList.add('sim-pressed');
          const toast = doc.getElementById('mob-s1-toast');
          if (toast) toast.classList.remove('is-visible');
        } else if (section === 'scene1_payoff') {
          const el = doc.getElementById('motion');
          if (el) el.scrollIntoView({ behavior: 'instant', block: 'start' });
          setSlide(0);
          const sheet = doc.getElementById('mob-s1-sheet');
          if (sheet) sheet.classList.remove('is-open');
          const toast = doc.getElementById('mob-s1-toast');
          if (toast) toast.classList.add('is-visible');
          const safe = doc.getElementById('mob-s1-safe');
          if (safe) safe.textContent = 'Safe: ₹36,350';
          const spent = doc.getElementById('mob-s1-spent-meta');
          if (spent) spent.textContent = 'Spent: ₹13,650';
          const bar = doc.getElementById('mob-s1-budget-bar');
          if (bar) bar.style.width = '27%';
          const s1List = doc.getElementById('mob-s1-tx-list');
          if (s1List && !s1List.querySelector('.mob-s1-added')) {
            const row = doc.createElement('div');
            row.className = 'mob-tx-row mob-s1-added';
            row.innerHTML = '<div class="mob-tx-left"><span class="replica-cat-badge badge-groceries">Groceries</span><span>Kirana store</span></div><span class="replica-tx-amt tx-out tabular-nums">−₹1,200</span>';
            s1List.insertBefore(row, s1List.firstChild);
          }

        // Scene 2
        } else if (section === 'scene2_start') {
          const el = doc.getElementById('motion');
          if (el) el.scrollIntoView({ behavior: 'instant', block: 'start' });
          setSlide(1);
          const bar = doc.getElementById('mob-s2-bar');
          if (bar) { bar.className = 'motion-bar-fill bar-amber'; bar.style.width = '92%'; }
          const notif = doc.getElementById('mob-s2-notification');
          if (notif) notif.classList.remove('is-visible');
        } else if (section === 'scene2_mid') {
          const el = doc.getElementById('motion');
          if (el) el.scrollIntoView({ behavior: 'instant', block: 'start' });
          setSlide(1);
          const btn = doc.getElementById('mob-s2-add-btn');
          if (btn) btn.classList.add('sim-pressed');
        } else if (section === 'scene2_payoff') {
          const el = doc.getElementById('motion');
          if (el) el.scrollIntoView({ behavior: 'instant', block: 'start' });
          setSlide(1);
          const notif = doc.getElementById('mob-s2-notification');
          if (notif) notif.classList.add('is-visible');
          const bar = doc.getElementById('mob-s2-bar');
          if (bar) { bar.className = 'motion-bar-fill bar-coral'; bar.style.width = '100%'; }
          const sub = doc.getElementById('mob-s2-sub');
          if (sub) sub.textContent = '₹5,250 / ₹5,000 (105%)';
          const badge = doc.getElementById('mob-s2-badge');
          if (badge) { badge.className = 'motion-badge-coral'; badge.textContent = 'Over by ₹250'; }

        // Scene 3
        } else if (section === 'scene3_start') {
          const el = doc.getElementById('motion');
          if (el) el.scrollIntoView({ behavior: 'instant', block: 'start' });
          setSlide(2);
          const bar = doc.getElementById('mob-s3-bar');
          if (bar) { bar.style.width = '45%'; }
          const val = doc.getElementById('mob-s3-val');
          if (val) val.textContent = '₹45,000';
          const badge = doc.getElementById('mob-s3-milestone');
          if (badge) badge.style.display = 'none';
        } else if (section === 'scene3_mid') {
          const el = doc.getElementById('motion');
          if (el) el.scrollIntoView({ behavior: 'instant', block: 'start' });
          setSlide(2);
          const btn = doc.getElementById('mob-s3-fund-btn');
          if (btn) btn.classList.add('sim-pressed');
        } else if (section === 'scene3_payoff') {
          const el = doc.getElementById('motion');
          if (el) el.scrollIntoView({ behavior: 'instant', block: 'start' });
          setSlide(2);
          const bar = doc.getElementById('mob-s3-bar');
          if (bar) bar.style.width = '50%';
          const val = doc.getElementById('mob-s3-val');
          if (val) val.textContent = '₹50,000';
          const badge = doc.getElementById('mob-s3-milestone');
          if (badge) { badge.style.display = 'inline-flex'; badge.classList.add('sim-pop'); }

        // Scene 4
        } else if (section === 'scene4_start') {
          const el = doc.getElementById('motion');
          if (el) el.scrollIntoView({ behavior: 'instant', block: 'start' });
          setSlide(3);
          const row = doc.getElementById('mob-s4-row');
          if (row) row.classList.remove('is-swiped');
          const feed = doc.getElementById('mob-s4-feed-row');
          if (feed) feed.style.display = 'none';
        } else if (section === 'scene4_mid') {
          const el = doc.getElementById('motion');
          if (el) el.scrollIntoView({ behavior: 'instant', block: 'start' });
          setSlide(3);
          const row = doc.getElementById('mob-s4-row');
          if (row) row.classList.add('is-swiped');
          const btn = doc.getElementById('mob-s4-repay-btn');
          if (btn) btn.classList.add('sim-pressed');
        } else if (section === 'scene4_payoff') {
          const el = doc.getElementById('motion');
          if (el) el.scrollIntoView({ behavior: 'instant', block: 'start' });
          setSlide(3);
          const row = doc.getElementById('mob-s4-row');
          if (row) row.classList.add('is-swiped');
          const val = doc.getElementById('mob-s4-val');
          if (val) val.textContent = '₹10,000';
          const feed = doc.getElementById('mob-s4-feed-row');
          if (feed) feed.style.display = 'flex';

        // Vault
        } else if (section === 'vault_mid_hold') {
          const el = doc.getElementById('mob-feat-vault');
          if (el) el.scrollIntoView({ behavior: 'instant', block: 'center' });
          const vb = doc.getElementById('mob-vault-box');
          if (vb) { vb.classList.add('holding'); vb.classList.remove('unblurred'); }
        } else if (section === 'vault_revealed') {
          const el = doc.getElementById('mob-feat-vault');
          if (el) el.scrollIntoView({ behavior: 'instant', block: 'center' });
          const vb = doc.getElementById('mob-vault-box');
          if (vb) { vb.classList.remove('holding'); vb.classList.add('unblurred'); }
          const vo = doc.getElementById('mob-vault-overlay');
          if (vo) vo.style.opacity = '0';

        // Category Chips
        } else if (section === 'category_food') {
          const el = doc.getElementById('mob-feat-categories');
          if (el) el.scrollIntoView({ behavior: 'instant', block: 'center' });
          const chips = doc.querySelectorAll('#mob-category-chips .paper-chip');
          chips.forEach(c => c.classList.toggle('selected', c.getAttribute('data-cat') === 'food'));
          const cName = doc.getElementById('mob-cat-name'); if (cName) cName.textContent = 'Food & Dining';
          const cStat = doc.getElementById('mob-cat-status'); if (cStat) cStat.textContent = '₹800 left';
          const cBar = doc.getElementById('mob-cat-bar'); if (cBar) { cBar.className = 'motion-bar-fill bar-amber'; cBar.style.width = '84%'; }
        } else if (section === 'category_bills') {
          const el = doc.getElementById('mob-feat-categories');
          if (el) el.scrollIntoView({ behavior: 'instant', block: 'center' });
          const chips = doc.querySelectorAll('#mob-category-chips .paper-chip');
          chips.forEach(c => c.classList.toggle('selected', c.getAttribute('data-cat') === 'bills'));
          const cName = doc.getElementById('mob-cat-name'); if (cName) cName.textContent = 'Bills & Utilities';
          const cStat = doc.getElementById('mob-cat-status'); if (cStat) cStat.textContent = 'On track';
          const cBar = doc.getElementById('mob-cat-bar'); if (cBar) { cBar.className = 'motion-bar-fill bar-emerald'; cBar.style.width = '61%'; }
        } else if (section === 'category_transit') {
          const el = doc.getElementById('mob-feat-categories');
          if (el) el.scrollIntoView({ behavior: 'instant', block: 'center' });
          const chips = doc.querySelectorAll('#mob-category-chips .paper-chip');
          chips.forEach(c => c.classList.toggle('selected', c.getAttribute('data-cat') === 'transit'));
          const cName = doc.getElementById('mob-cat-name'); if (cName) cName.textContent = 'Metro & Transit';
          const cStat = doc.getElementById('mob-cat-status'); if (cStat) cStat.textContent = 'Over by ₹50';
          const cBar = doc.getElementById('mob-cat-bar'); if (cBar) { cBar.className = 'motion-bar-fill bar-coral'; cBar.style.width = '100%'; }

        // Donut
        } else if (section === 'donut_selected') {
          const el = doc.getElementById('mob-feat-donut');
          if (el) el.scrollIntoView({ behavior: 'instant', block: 'center' });
          const val = doc.getElementById('mob-donut-val'); if (val) val.textContent = '₹4,800';
          const lbl = doc.getElementById('mob-donut-lbl'); if (lbl) lbl.textContent = 'Food (39%)';
          const segs = doc.querySelectorAll('#mob-donut-svg .donut-ring-seg');
          segs.forEach(s => s.classList.toggle('active', s.getAttribute('data-cat') === 'Food'));
          const legs = doc.querySelectorAll('#mob-donut-legend .mob-donut-leg-item');
          legs.forEach(l => l.classList.toggle('active', l.getAttribute('data-cat') === 'Food'));

        // Install Card
        } else if (section === 'install_card') {
          const el = doc.getElementById('mob-feat-pwa');
          if (el) el.scrollIntoView({ behavior: 'instant', block: 'center' });

        // Simulator Positive & Negative
        } else if (section === 'simulator_positive') {
          const el = doc.getElementById('simulator');
          if (el) el.scrollIntoView({ behavior: 'instant', block: 'start' });
          const inc = doc.getElementById('sim-income'); if (inc) inc.value = 50000;
          const exp = doc.getElementById('sim-expenses'); if (exp) exp.value = 28000;
          const rVal = doc.getElementById('sim-rate-val'); if (rVal) { rVal.textContent = '44.0%'; rVal.className = 'sim-stat-val text-emerald'; }
          const remVal = doc.getElementById('sim-remaining-val'); if (remVal) { remVal.textContent = '₹22,000 / mo'; remVal.className = 'sim-stat-val'; }
          const yVal = doc.getElementById('sim-yearly-val'); if (yVal) { yVal.textContent = '₹2,64,000'; yVal.className = 'sim-stat-val text-emerald'; }
        } else if (section === 'simulator_negative') {
          const el = doc.getElementById('simulator');
          if (el) el.scrollIntoView({ behavior: 'instant', block: 'start' });
          const inc = doc.getElementById('sim-income'); if (inc) inc.value = 30000;
          const exp = doc.getElementById('sim-expenses'); if (exp) exp.value = 60000;
          const rVal = doc.getElementById('sim-rate-val'); if (rVal) { rVal.textContent = '−100.0%'; rVal.className = 'sim-stat-val text-coral'; }
          const remVal = doc.getElementById('sim-remaining-val'); if (remVal) { remVal.textContent = '−₹30,000 / mo'; remVal.className = 'sim-stat-val text-coral'; }
          const yVal = doc.getElementById('sim-yearly-val'); if (yVal) { yVal.textContent = '−₹3,60,000'; yVal.className = 'sim-stat-val text-coral'; }
          const sp = doc.getElementById('sim-status-pill');
          if (sp) {
            sp.className = 'replica-sync-pill pill-coral';
            const icon = sp.querySelector('i'); if (icon) icon.className = 'fas fa-triangle-exclamation text-coral';
            const span = sp.querySelector('span'); if (span) span.textContent = 'Spending exceeds income';
          }

        // Single closing card
        } else if (section === 'single_closing') {
          const el = doc.querySelector('.mobile-closing-appstore');
          if (el) el.scrollIntoView({ behavior: 'instant', block: 'center' });
        }

        await new Promise(r => setTimeout(r, 600));
        window.__ready = true;
      };
      frame.src = '/index.html?t=' + Date.now();
    }
  </script>
</body>
</html>
