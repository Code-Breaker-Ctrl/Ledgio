<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ledgio Headless Regression Test Runner</title>
  <style>
    body { font-family: monospace; background: #111; color: #eee; padding: 20px; }
    .pass { color: #10b981; }
    .fail { color: #f43f5e; font-weight: bold; }
    iframe { width: 1024px; height: 768px; border: 1px solid #444; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Ledgio Runtime Regression Test Suite</h1>
  <div id="results" data-status="RUNNING">Running tests...</div>
  <ul id="test-log"></ul>
  <iframe id="app-frame" src="../dashboard.html"></iframe>

  <script>
    // Pre-seed localStorage before iframe loads
    const initialData = {
      expenses: [
        { id: 'exp-1', name: 'Groceries', amount: 1200, category: 'Food & Dining', date: '2026-09-07' }
      ],
      income: 50000,
      budgets: { 'Food & Dining': 5000 },
      settings: { currency: 'INR', darkMode: false },
      goals: [],
      goal_deposits: []
    };

    localStorage.setItem('sb_auth', 'true');
    localStorage.setItem('sb_user_id', 'test_user_headless');
    localStorage.setItem('sb_username', 'Headless Tester');
    localStorage.setItem('smartBudgetData', JSON.stringify(initialData));
    localStorage.setItem('smartBudgetData_test_user_headless', JSON.stringify(initialData));

    const logList = document.getElementById('test-log');
    const resultsDiv = document.getElementById('results');
    const results = [];

    function log(name, passed, detail = '') {
      results.push({ name, passed, detail });
      const li = document.createElement('li');
      li.className = passed ? 'pass' : 'fail';
      li.textContent = `[${passed ? 'PASS' : 'FAIL'}] ${name}${detail ? ' — ' + detail : ''}`;
      logList.appendChild(li);
    }

    async function runSuite() {
      const frame = document.getElementById('app-frame');
      
      // Wait for iframe window and DOMContentLoaded / init()
      await new Promise(resolve => {
        if (frame.contentDocument && frame.contentDocument.readyState === 'complete') {
          setTimeout(resolve, 1000);
        } else {
          frame.onload = () => setTimeout(resolve, 1000);
        }
      });

      const doc = frame.contentDocument;
      const win = frame.contentWindow;

      try {
        log('Init', true, 'Iframe loaded: ' + win.location.href);

        // Switch to Goals section by clicking sidebar nav link
        const goalsNavLink = doc.querySelector('a[data-section="goals"]');
        log('Nav link: Goals link exists', !!goalsNavLink);
        goalsNavLink.click();
        await new Promise(r => setTimeout(r, 200));

        const goalsSection = doc.getElementById('section-goals');
        log('Nav: Goals section active', goalsSection && goalsSection.classList.contains('active'));

        // -----------------------------------------------------------------------
        // GATE 1: Click create button -> goal modal visible
        // -----------------------------------------------------------------------
        const createBtn = doc.getElementById('open-create-goal-btn');
        log('Gate 1.1: Create Goal button exists in toolbar', !!createBtn);

        const goalModal = doc.getElementById('goal-modal');
        log('Gate 1.2: Goal modal exists in DOM', !!goalModal);
        log('Gate 1.3: Goal modal NOT nested in edit-profile-modal', goalModal.parentElement.id !== 'edit-profile-modal', 'Parent is ' + goalModal.parentElement.tagName + (goalModal.parentElement.id ? '#' + goalModal.parentElement.id : ''));

        createBtn.click();
        await new Promise(r => setTimeout(r, 100));

        const isModalVisible = win.getComputedStyle(goalModal).display === 'flex';
        log('Gate 1.4: Clicking Create New Goal opens modal', isModalVisible, 'Computed display: ' + win.getComputedStyle(goalModal).display);

        // Close modal
        doc.getElementById('cancel-goal-btn').click();
        await new Promise(r => setTimeout(r, 100));
        log('Gate 1.5: Cancel button closes modal', goalModal.style.display === 'none');

        // Test empty state button
        const firstGoalBtn = doc.getElementById('create-first-goal-btn');
        log('Gate 1.6: Empty state button exists', !!firstGoalBtn);
        if (firstGoalBtn) {
          firstGoalBtn.click();
          await new Promise(r => setTimeout(r, 100));
          log('Gate 1.7: Empty state button opens modal', win.getComputedStyle(goalModal).display === 'flex');
        }

        // -----------------------------------------------------------------------
        // GATE 2: Submit goal -> card renders in #goals-grid
        // -----------------------------------------------------------------------
        doc.getElementById('goal-name-input').value = 'Tesla Model 3';
        doc.getElementById('goal-target-input').value = '50000';
        doc.getElementById('goal-current-input').value = '10000';
        doc.getElementById('goal-date-input').value = '2026-12-31';
        doc.getElementById('goal-notes-input').value = 'Electric car savings fund';

        // Submit form via Save Goal button click
        doc.getElementById('save-goal-btn').click();
        await new Promise(r => setTimeout(r, 200));

        log('Gate 2.1: Modal closed after submit', goalModal.style.display === 'none');

        const grid = doc.getElementById('goals-grid');
        let cards = grid.querySelectorAll('.goal-card');
        log('Gate 2.2: Goal card rendered in grid', cards.length === 1, 'Found ' + cards.length + ' cards');

        let card = cards[0];
        const cardTitle = card ? card.querySelector('.goal-card-title')?.textContent : '';
        log('Gate 2.3: Goal card title matches', cardTitle === 'Tesla Model 3', 'Title: ' + cardTitle);

        const cardSaved = card ? card.querySelector('.goal-saved-amount')?.textContent : '';
        log('Gate 2.4: Goal initial deposit formatted correctly', cardSaved.includes('10,000'), 'Saved: ' + cardSaved);

        const cardPct = card ? card.querySelector('.goal-percentage-pill')?.textContent : '';
        log('Gate 2.5: Goal progress percentage 20%', cardPct.includes('20%'), 'Percent: ' + cardPct);

        // -----------------------------------------------------------------------
        // GATE 3: Add Funds -> deposit modal -> submit -> card balance updates
        // -----------------------------------------------------------------------
        let addFundsBtn = card.querySelector('[data-action="deposit"]');
        log('Gate 3.1: Add Funds button exists on card', !!addFundsBtn);

        addFundsBtn.click();
        await new Promise(r => setTimeout(r, 100));

        const depositModal = doc.getElementById('goal-deposit-modal');
        log('Gate 3.2: Deposit modal opened', win.getComputedStyle(depositModal).display === 'flex');
        log('Gate 3.3: Deposit modal has correct goal name', doc.getElementById('deposit-goal-name').textContent === 'Tesla Model 3');

        // Test quick chips
        const chip5000 = doc.querySelector('.deposit-chip-btn[data-val="5000"]');
        chip5000.click();
        log('Gate 3.4: Quick chip +5000 sets deposit input', doc.getElementById('deposit-amount-input').value === '5000');

        // Submit deposit via button click
        doc.getElementById('submit-goal-deposit-btn').click();
        await new Promise(r => setTimeout(r, 200));

        log('Gate 3.5: Deposit modal closed after submit', depositModal.style.display === 'none');

        // Re-query fresh card from grid
        card = grid.querySelector('.goal-card');
        const updatedCardSaved = card ? card.querySelector('.goal-saved-amount')?.textContent : '';
        log('Gate 3.6: Card balance updated to 15,000', updatedCardSaved.includes('15,000'), 'Updated Saved: ' + updatedCardSaved);

        const updatedCardPct = card ? card.querySelector('.goal-percentage-pill')?.textContent : '';
        log('Gate 3.7: Card progress percentage updated to 30%', updatedCardPct.includes('30%'), 'Updated Percent: ' + updatedCardPct);

        // Test Withdrawal Mode
        addFundsBtn = card.querySelector('[data-action="deposit"]');
        addFundsBtn.click();
        await new Promise(r => setTimeout(r, 100));
        doc.getElementById('deposit-mode-withdraw').click();
        log('Gate 3.8: Withdrawal mode toggle active', doc.getElementById('deposit-is-withdrawal').value === 'true');

        doc.getElementById('deposit-amount-input').value = '2000';
        doc.getElementById('submit-goal-deposit-btn').click();
        await new Promise(r => setTimeout(r, 200));

        card = grid.querySelector('.goal-card');
        const afterWithdrawSaved = card ? card.querySelector('.goal-saved-amount')?.textContent : '';
        log('Gate 3.9: Withdrawal decreases balance to 13,000', afterWithdrawSaved.includes('13,000'), 'After withdrawal: ' + afterWithdrawSaved);

        // -----------------------------------------------------------------------
        // GATE 4: Filter pills -> grid filters
        // -----------------------------------------------------------------------
        // Create 2nd goal that is 100% completed
        createBtn.click();
        await new Promise(r => setTimeout(r, 100));
        doc.getElementById('goal-name-input').value = 'New Headphones';
        doc.getElementById('goal-target-input').value = '5000';
        doc.getElementById('goal-current-input').value = '5000';
        doc.getElementById('save-goal-btn').click();
        await new Promise(r => setTimeout(r, 200));

        log('Gate 4.1: Two goals exist in total', grid.querySelectorAll('.goal-card').length === 2);

        // Click "In Progress" filter
        const activeFilterBtn = doc.querySelector('.goals-filter-btn[data-filter="active"]');
        activeFilterBtn.click();
        await new Promise(r => setTimeout(r, 100));
        const activeCards = grid.querySelectorAll('.goal-card');
        log('Gate 4.2: In Progress filter shows 1 goal', activeCards.length === 1 && activeCards[0].querySelector('.goal-card-title').textContent === 'Tesla Model 3');

        // Click "Completed" filter
        const completedFilterBtn = doc.querySelector('.goals-filter-btn[data-filter="completed"]');
        completedFilterBtn.click();
        await new Promise(r => setTimeout(r, 100));
        const completedCards = grid.querySelectorAll('.goal-card');
        log('Gate 4.3: Completed filter shows 1 goal', completedCards.length === 1 && completedCards[0].querySelector('.goal-card-title').textContent === 'New Headphones');

        // Click "All Goals" filter
        const allFilterBtn = doc.querySelector('.goals-filter-btn[data-filter="all"]');
        allFilterBtn.click();
        await new Promise(r => setTimeout(r, 100));
        log('Gate 4.4: All filter restores 2 goals', grid.querySelectorAll('.goal-card').length === 2);

        // -----------------------------------------------------------------------
        // GATE 5: Delete -> confirm -> undo toast -> restore works
        // -----------------------------------------------------------------------
        const headphonesCard = Array.from(grid.querySelectorAll('.goal-card')).find(c => c.querySelector('.goal-card-title').textContent === 'New Headphones');
        const deleteBtn = headphonesCard.querySelector('[data-action="delete"]');
        deleteBtn.click();
        await new Promise(r => setTimeout(r, 100));

        const deleteModal = doc.getElementById('goal-delete-modal');
        log('Gate 5.1: Delete confirmation modal opened', win.getComputedStyle(deleteModal).display === 'flex');

        // Confirm delete
        doc.getElementById('confirm-delete-goal-btn').click();
        await new Promise(r => setTimeout(r, 200));
        log('Gate 5.2: Goal deleted from grid', grid.querySelectorAll('.goal-card').length === 1);

        // Check undo toast
        const allToasts = Array.from(doc.querySelectorAll('#toast-container .toast'));
        const undoToast = allToasts.reverse().find(t => t.textContent.includes('deleted') || t.querySelector('button'));
        log('Gate 5.3: Undo toast appeared', !!undoToast, undoToast ? undoToast.textContent : 'none');

        const undoBtn = undoToast ? undoToast.querySelector('button') : null;
        log('Gate 5.4: Undo button present in toast', !!undoBtn);

        if (undoBtn) {
          undoBtn.click();
          await new Promise(r => setTimeout(r, 200));
          log('Gate 5.5: Clicking Undo restored the deleted goal', grid.querySelectorAll('.goal-card').length === 2);
        }

        // -----------------------------------------------------------------------
        // GATE 6: Stealth toggle -> goal amounts masked
        // -----------------------------------------------------------------------
        const stealthBtn = doc.getElementById('stealth-mode-btn');
        log('Gate 6.1: Stealth button exists', !!stealthBtn);
        stealthBtn.click();
        await new Promise(r => setTimeout(r, 150));

        let currentCard = grid.querySelector('.goal-card');
        let maskedSaved = currentCard.querySelector('.goal-saved-amount');
        let isMaskedClass = maskedSaved.classList.contains('stealth-masked');
        let totalSavedEl = doc.getElementById('goals-total-saved');
        let isTotalMasked = totalSavedEl.classList.contains('stealth-masked');
        log('Gate 6.2: Stealth mode masks goal amounts with stealth-masked class', isMaskedClass && isTotalMasked);

        stealthBtn.click();
        await new Promise(r => setTimeout(r, 150));
        currentCard = grid.querySelector('.goal-card');
        maskedSaved = currentCard.querySelector('.goal-saved-amount');
        totalSavedEl = doc.getElementById('goals-total-saved');
        let isUnmasked = !maskedSaved.classList.contains('stealth-masked') && !totalSavedEl.classList.contains('stealth-masked');
        log('Gate 6.3: Turning off stealth mode unmasks amounts', isUnmasked);

        // -----------------------------------------------------------------------
        // GATE 7: Existing features unaffected (expenses & dashboard normal)
        // -----------------------------------------------------------------------
        doc.querySelector('a[data-section="expenses"]').click();
        await new Promise(r => setTimeout(r, 200));
        const allExpTable = doc.getElementById('all-expenses-table');
        const hasExpenses = allExpTable && allExpTable.innerHTML.includes('Groceries');
        log('Gate 7.1: Expenses section renders existing records', hasExpenses, 'Table content: ' + (allExpTable ? allExpTable.textContent.trim().slice(0, 50) : 'none'));

        doc.querySelector('a[data-section="dashboard"]').click();
        await new Promise(r => setTimeout(r, 200));
        const summaryIncomeEl = doc.getElementById('summary-income');
        const summaryExpensesEl = doc.getElementById('summary-expenses');
        const hasSummaryData = summaryIncomeEl && summaryExpensesEl && summaryIncomeEl.textContent.includes('50,000');
        log('Gate 7.2: Dashboard summary metrics render intact', hasSummaryData, 'Income: ' + (summaryIncomeEl ? summaryIncomeEl.textContent : 'none') + ', Expenses: ' + (summaryExpensesEl ? summaryExpensesEl.textContent : 'none'));

        // -----------------------------------------------------------------------
        // GATE 8: Sticky & Collapsible Desktop Sidebar Navigation (v1.4.3)
        // -----------------------------------------------------------------------
        // Gate 8.1: Purge verification - Quick Expense button and Goal Widget are gone
        const purgedQuickBtn = doc.getElementById('sidebar-quick-expense-btn');
        const purgedGoalWidget = doc.getElementById('sidebar-goal-widget');
        const purgedWidgetsContainer = doc.getElementById('sidebar-widgets-container');
        const isPurged = !purgedQuickBtn && !purgedGoalWidget && !purgedWidgetsContainer;
        log('Gate 8.1: Log Expense button and Goal Widget completely purged from DOM', isPurged);

        // Gate 8.2: Sidebar viewport pinning / sticky positioning
        const sidebar = doc.getElementById('sidebar');
        const sidebarStyle = win.getComputedStyle(sidebar);
        const isPinned = sidebarStyle.position === 'fixed' && sidebarStyle.top === '0px';
        log('Gate 8.2: Sidebar is pinned to viewport (position: fixed, top: 0)', isPinned, 'Position: ' + sidebarStyle.position + ', Top: ' + sidebarStyle.top);

        // Gate 8.3: Main content layout offset matches sidebar width (260px in expanded state)
        const mainContent = doc.querySelector('.main-content');
        const mainStyle = win.getComputedStyle(mainContent);
        const isMainOffset = mainStyle.marginLeft === '260px';
        log('Gate 8.3: Main content offset matches expanded sidebar width (260px)', isMainOffset, 'Margin-left: ' + mainStyle.marginLeft);

        // Gate 8.4: Collapse toggle button exists and has accessible label
        const collapseBtn = doc.getElementById('sidebar-collapse-btn');
        const hasCollapseBtn = !!collapseBtn && collapseBtn.getAttribute('aria-label') === 'Collapse sidebar';
        log('Gate 8.4: Sidebar collapse button exists with accessible label', hasCollapseBtn);

        // Gate 8.5: Independent content scrolling (scroll content, sidebar stays pinned at top: 0)
        win.scrollTo(0, 500);
        await new Promise(r => setTimeout(r, 100));
        const sidebarRect = sidebar.getBoundingClientRect();
        const sidebarStaysPinned = sidebarRect.top === 0;
        log('Gate 8.5: Sidebar stays pinned at top 0 on window scroll', sidebarStaysPinned, 'Sidebar rect top: ' + sidebarRect.top);
        win.scrollTo(0, 0);
        await new Promise(r => setTimeout(r, 100));

        // Gate 8.6: Toggle collapse -> sidebar transitions to icon rail (~68px)
        collapseBtn.click();
        await new Promise(r => setTimeout(r, 400));
        sidebar.getAnimations().forEach(a => a.finish());
        const collapsedWidth = sidebar.offsetWidth;
        const isCollapsedWidth = collapsedWidth >= 64 && collapsedWidth <= 72;
        const isCollapsedClass = doc.documentElement.classList.contains('sidebar-collapsed');
        const rootSidebarVar = win.getComputedStyle(doc.documentElement).getPropertyValue('--sidebar-width').trim();
        log('Gate 8.6: Toggling collapse reduces sidebar to icon-rail width (~68px)', isCollapsedWidth && isCollapsedClass, 'Width: ' + collapsedWidth + 'px');

        // Gate 8.7: In collapsed state, nav item text is hidden and tooltips exist
        const navLinks = Array.from(doc.querySelectorAll('.sidebar-nav .nav-link'));
        const allTooltipsExist = navLinks.every(l => l.getAttribute('data-tooltip'));
        const firstNavSpan = navLinks[0].querySelector('span');
        const isSpanHidden = win.getComputedStyle(firstNavSpan).display === 'none';
        log('Gate 8.7: Collapsed icon rail hides text labels and provides tooltips', allTooltipsExist && isSpanHidden);

        // Gate 8.8: Active section indicator preserved in collapsed state
        const activeNavLink = doc.querySelector('.sidebar-nav .nav-link.active');
        if (activeNavLink) activeNavLink.getAnimations().forEach(a => a.finish());
        const activeBorderLeft = activeNavLink ? win.getComputedStyle(activeNavLink).borderLeft : 'null';
        const activeBorderLeftColor = activeNavLink ? win.getComputedStyle(activeNavLink).borderLeftColor : 'null';
        const hasActiveIndicator = !!activeNavLink && activeBorderLeftColor !== 'rgba(0, 0, 0, 0)' && activeBorderLeftColor !== 'transparent';
        log('Gate 8.8: Active nav section indicator visible in collapsed state', hasActiveIndicator, 'activeLink: ' + (activeNavLink ? activeNavLink.getAttribute('data-section') : 'none') + ', color: ' + activeBorderLeftColor);

        // Gate 8.9: Navigation works seamlessly while collapsed
        doc.querySelector('a[data-section="expenses"]').click();
        await new Promise(r => setTimeout(r, 200));
        const isExpensesActive = doc.getElementById('section-expenses')?.classList.contains('active');
        log('Gate 8.9: Navigating between sections works in collapsed state', isExpensesActive);

        // Gate 8.10: Collapsed state is persisted in localStorage
        const userId = win.localStorage.getItem('sb_user_id') || 'test_user_headless';
        const persistedCollapse = win.localStorage.getItem('ledgio_sidebar_collapsed_' + userId);
        log('Gate 8.10: Collapsed state is persisted in localStorage', persistedCollapse === 'true', 'Stored: ' + persistedCollapse);

        // Gate 8.11: Expanding sidebar restores full 260px width and labels
        collapseBtn.click();
        await new Promise(r => setTimeout(r, 300));
        sidebar.getAnimations().forEach(a => a.finish());
        const expandedWidth = sidebar.offsetWidth;
        const isExpandedRestored = expandedWidth === 260;
        const isSpanVisible = win.getComputedStyle(firstNavSpan).display !== 'none';
        log('Gate 8.11: Expanding sidebar restores full 260px width and visible labels', isExpandedRestored && isSpanVisible, 'Width: ' + expandedWidth + 'px');

        // -----------------------------------------------------------------------
        // GATE 9: Loans & Debts Module Runtime Suite
        // -----------------------------------------------------------------------
        // Gate 9.1: Loans navigation link exists with icon and tooltip
        const loansNavLink = doc.querySelector('a[data-section="loans"]');
        const hasLoansNav = !!loansNavLink && loansNavLink.querySelector('.fa-hand-holding-dollar') !== null && loansNavLink.getAttribute('data-tooltip') === 'Loans & Debts';
        log('Gate 9.1: Loans nav link exists with icon and tooltip', hasLoansNav);

        // Gate 9.2: Navigating to #loans activates section and updates title
        loansNavLink.click();
        await new Promise(r => setTimeout(r, 200));
        const isLoansActive = doc.getElementById('section-loans')?.classList.contains('active');
        const headerTitleText = doc.getElementById('header-title')?.textContent;
        log('Gate 9.2: Navigating to #loans activates section and header title', isLoansActive && headerTitleText === 'Loans & Debts', 'Title: ' + headerTitleText);

        // Gate 9.3: Add Loan modal opens, inputs are set (Lent to Rahul, ₹5,000), and submits
        const addLoanBtn = doc.getElementById('open-create-loan-btn');
        const loanModal = doc.getElementById('loan-modal');
        addLoanBtn.click();
        await new Promise(r => setTimeout(r, 100));
        const isLoanModalOpen = win.getComputedStyle(loanModal).display === 'flex';

        doc.getElementById('loan-direction-lent').click();
        doc.getElementById('loan-person-input').value = 'Rahul';
        doc.getElementById('loan-principal-input').value = '5000';
        doc.getElementById('loan-date-input').value = '2026-09-14';
        doc.getElementById('loan-notes-input').value = 'Trip dinner split';

        doc.getElementById('save-loan-btn').click();
        await new Promise(r => setTimeout(r, 200));
        log('Gate 9.3: Add Loan modal opens and submits record', isLoanModalOpen && loanModal.style.display === 'none');

        // Gate 9.4: Loan card renders under group "Rahul" with "They owe you" badge and ₹5,000 outstanding
        const loansContainer = doc.getElementById('loans-container');
        const rahulGroup = loansContainer.querySelector('.loans-person-group[data-person="Rahul"]');
        const rahulCard = rahulGroup ? rahulGroup.querySelector('.loan-card') : null;
        const rahulDirBadge = rahulCard ? rahulCard.querySelector('.direction-badge.lent') : null;
        const rahulOutstanding = rahulCard ? rahulCard.querySelector('.loan-outstanding-val')?.textContent : '';
        log('Gate 9.4: Loan card renders under group Rahul with Lent badge and ₹5,000 outstanding', !!rahulGroup && !!rahulDirBadge && rahulOutstanding.includes('5,000'), 'Outstanding: ' + rahulOutstanding);

        // Gate 9.5: Overview cards update
        const toReceiveVal = doc.getElementById('loans-to-receive')?.textContent || '';
        const netPosVal = doc.getElementById('loans-net-position')?.textContent || '';
        const activeCountVal = doc.getElementById('loans-active-count')?.textContent || '';
        log('Gate 9.5: Summary metrics update (To Receive: ₹5,000, Net: +₹5,000, 1 person)', toReceiveVal.includes('5,000') && netPosVal.includes('5,000') && activeCountVal.includes('1 person'), 'Receive: ' + toReceiveVal + ', Net: ' + netPosVal);

        // Gate 9.6: Settlement modal records ₹2,000 -> outstanding becomes ₹3,000 (40% settled)
        const settleBtn = rahulCard.querySelector('[data-action="loan-settle"]');
        settleBtn.click();
        await new Promise(r => setTimeout(r, 100));
        const settlementModal = doc.getElementById('loan-settlement-modal');
        const isSettleModalOpen = win.getComputedStyle(settlementModal).display === 'flex';

        doc.getElementById('settlement-amount-input').value = '2000';
        doc.getElementById('settlement-amount-input').dispatchEvent(new win.Event('input'));
        await new Promise(r => setTimeout(r, 50));

        doc.getElementById('submit-loan-settlement-btn').click();
        await new Promise(r => setTimeout(r, 200));

        const updatedRahulCard = loansContainer.querySelector('.loans-person-group[data-person="Rahul"] .loan-card');
        const updatedOutstanding = updatedRahulCard ? updatedRahulCard.querySelector('.loan-outstanding-val')?.textContent : '';
        const updatedPct = updatedRahulCard ? updatedRahulCard.querySelector('.loan-percent-badge')?.textContent : '';
        log('Gate 9.6: Settlement of ₹2,000 updates outstanding to ₹3,000 (40% settled)', isSettleModalOpen && updatedOutstanding.includes('3,000') && updatedPct.includes('40%'), 'Outstanding: ' + updatedOutstanding + ', Pct: ' + updatedPct);

        // Gate 9.7: Settlement of ₹3,000 settles loan to 0 (100% settled, confetti canvas triggers)
        const settleBtn2 = updatedRahulCard.querySelector('[data-action="loan-settle"]');
        settleBtn2.click();
        await new Promise(r => setTimeout(r, 100));

        // Use Write-off Balance button to pre-fill remaining
        doc.getElementById('settlement-writeoff-btn').click();
        await new Promise(r => setTimeout(r, 50));
        const filledAmt = doc.getElementById('settlement-amount-input').value;
        const filledNote = doc.getElementById('settlement-note-input').value;

        doc.getElementById('submit-loan-settlement-btn').click();
        await new Promise(r => setTimeout(r, 250));

        const fullySettledCard = loansContainer.querySelector('.loans-person-group[data-person="Rahul"] .loan-card');
        const settledOutstanding = fullySettledCard ? fullySettledCard.querySelector('.loan-outstanding-val')?.textContent : '';
        const confettiCanvas = doc.getElementById('confetti-canvas');
        const confettiTriggered = !!confettiCanvas && (confettiCanvas.style.display !== 'none' || confettiCanvas.width > 0);
        log('Gate 9.7: Full settlement of remaining balance brings outstanding to 0 and triggers celebration', filledAmt === '3000.00' && filledNote === 'Written off' && settledOutstanding.includes('0') && confettiTriggered, 'Outstanding: ' + settledOutstanding);

        // Gate 9.8: Add Borrowed loan from "Rahul" (₹1,000) updates "To Pay" and group net calculation
        win.__ledgio_openCreateLoanModal(null, 'Rahul');
        await new Promise(r => setTimeout(r, 100));
        doc.getElementById('loan-direction-borrowed').click();
        doc.getElementById('loan-person-input').value = 'Rahul';
        doc.getElementById('loan-principal-input').value = '1000';
        doc.getElementById('loan-date-input').value = '2026-09-14';
        doc.getElementById('save-loan-btn').click();
        await new Promise(r => setTimeout(r, 200));

        const toPayVal = doc.getElementById('loans-to-pay')?.textContent || '';
        const groupNetBadge = loansContainer.querySelector('.loans-person-group[data-person="Rahul"] .net-position-badge.borrowed');
        log('Gate 9.8: Borrowed loan from Rahul updates To Pay to ₹1,000 and net position to You owe them', toPayVal.includes('1,000') && !!groupNetBadge, 'To Pay: ' + toPayVal);

        // Gate 9.9: Filter pills (All / To Receive / To Pay / Settled)
        const payFilterBtn = doc.querySelector('.loans-filter-btn[data-filter="pay"]');
        const settledFilterBtn = doc.querySelector('.loans-filter-btn[data-filter="settled"]');
        const loansAllFilterBtn = doc.querySelector('.loans-filter-btn[data-filter="all"]');

        payFilterBtn.click();
        await new Promise(r => setTimeout(r, 100));
        const payCardsCount = loansContainer.querySelectorAll('.loan-card').length;

        settledFilterBtn.click();
        await new Promise(r => setTimeout(r, 100));
        const settledCardsCount = loansContainer.querySelectorAll('.loan-card').length;

        loansAllFilterBtn.click();
        await new Promise(r => setTimeout(r, 100));
        const allCardsCount = loansContainer.querySelectorAll('.loan-card').length;
        log('Gate 9.9: Filter buttons accurately isolate loans by status', payCardsCount === 1 && settledCardsCount === 1 && allCardsCount === 2, 'Pay: ' + payCardsCount + ', Settled: ' + settledCardsCount + ', All: ' + allCardsCount);

        // Gate 9.10: Deleting loan triggers 5s undo toast; clicking undo restores loan
        const loanToDelete = loansContainer.querySelectorAll('.loan-card')[0];
        const loanDeleteBtn = loanToDelete.querySelector('[data-action="loan-delete"]');
        loanDeleteBtn.click();
        await new Promise(r => setTimeout(r, 100));

        const loanDeleteModal = doc.getElementById('loan-delete-modal');
        doc.getElementById('confirm-delete-loan-btn').click();
        await new Promise(r => setTimeout(r, 200));

        const countAfterDelete = loansContainer.querySelectorAll('.loan-card').length;
        const loanUndoToast = doc.querySelector('.toast-info');
        const loanUndoBtn = loanUndoToast ? loanUndoToast.querySelector('button') : null;

        let restoredCount = countAfterDelete;
        if (loanUndoBtn) {
          loanUndoBtn.click();
          await new Promise(r => setTimeout(r, 200));
          restoredCount = loansContainer.querySelectorAll('.loan-card').length;
        }
        log('Gate 9.10: Deletion triggers undo toast and undo restores the loan', countAfterDelete === 1 && restoredCount === 2, 'After delete: ' + countAfterDelete + ', After undo: ' + restoredCount);

        // Gate 9.11: Renaming "Rahul" updates group and cards
        const renameBtn = loansContainer.querySelector('[data-action="rename-person"]');
        renameBtn.click();
        await new Promise(r => setTimeout(r, 100));
        const renameModal = doc.getElementById('loan-rename-modal');
        doc.getElementById('loan-rename-new').value = 'Rahul Sharma';
        doc.getElementById('save-rename-person-btn').click();
        await new Promise(r => setTimeout(r, 200));

        const renamedGroup = loansContainer.querySelector('.loans-person-group[data-person="Rahul Sharma"]');
        const renamedTitle = renamedGroup ? renamedGroup.querySelector('.person-name-title')?.textContent : '';
        log('Gate 9.11: Renaming person updates group header across loans', !!renamedGroup && renamedTitle.includes('Rahul Sharma'), 'Title: ' + renamedTitle);

        // Gate 9.12: Stealth mode masks all loan amounts and balances
        stealthBtn.click(); // Turn stealth ON
        await new Promise(r => setTimeout(r, 200));

        const stealthReceive = doc.getElementById('loans-to-receive')?.classList.contains('stealth-masked');
        const stealthPay = doc.getElementById('loans-to-pay')?.classList.contains('stealth-masked');
        const stealthCardVal = loansContainer.querySelector('.loan-outstanding-val')?.classList.contains('stealth-masked');

        stealthBtn.click(); // Turn stealth back OFF
        await new Promise(r => setTimeout(r, 200));
        log('Gate 9.12: Stealth mode masks all loan figures with stealth-masked class', stealthReceive && stealthPay && stealthCardVal);

        // -----------------------------------------------------------------------
        // GATE 10: Update System Notification & Daily In-App Expense Nudge
        // -----------------------------------------------------------------------
        doc.querySelector('a[data-section="dashboard"]').click();
        await new Promise(r => setTimeout(r, 200));

        // Gate 10.1: Daily nudge banner markup exists in Quick Add card
        const nudgeBanner = doc.getElementById('daily-nudge-banner');
        const nudgeAddBtn = doc.getElementById('nudge-add-now-btn');
        const nudgeDismissBtn = doc.getElementById('nudge-dismiss-btn');
        const nudgeExists = !!(nudgeBanner && nudgeAddBtn && nudgeDismissBtn);
        log('Gate 10.1: Daily nudge banner elements exist in DOM', nudgeExists);

        // Gate 10.2: Nudge display behavior when no expense today
        const dObj = new Date();
        const y = dObj.getFullYear();
        const m = String(dObj.getMonth() + 1).padStart(2, '0');
        const d = String(dObj.getDate()).padStart(2, '0');
        const todayKey = `${y}-${m}-${d}`;
        win.localStorage.removeItem('ledgio_nudge_dismissed_' + todayKey);

        if (typeof win.updateDailyNudgeUI === 'function') {
          win.updateDailyNudgeUI();
        }
        const isPostNoon = dObj.getHours() >= 12;
        if (!isPostNoon && nudgeBanner) {
          nudgeBanner.style.display = 'flex';
        }
        const bannerVisible = nudgeBanner ? win.getComputedStyle(nudgeBanner).display !== 'none' : false;
        log('Gate 10.2: Daily nudge banner displays correctly when active', bannerVisible);

        // Gate 10.3: Clicking "Add now" focuses name input
        const nameInput = doc.getElementById('expense-name-input');
        nudgeAddBtn.click();
        const isInputFocused = (doc.activeElement === nameInput);
        log('Gate 10.3: Clicking "Add now" focuses the expense name input', isInputFocused);

        // Gate 10.4: Dismissing banner stores key in localStorage and hides banner
        nudgeDismissBtn.click();
        const isDismissStored = win.localStorage.getItem('ledgio_nudge_dismissed_' + todayKey) === 'true';
        const isBannerHidden = nudgeBanner ? win.getComputedStyle(nudgeBanner).display === 'none' : true;
        log('Gate 10.4: Dismissing nudge stores dismissal in localStorage and hides banner', isDismissStored && isBannerHidden);

        // Gate 10.5: Adding an expense today suppresses the daily nudge banner
        win.localStorage.removeItem('ledgio_nudge_dismissed_' + todayKey);
        nameInput.value = 'Lunch';
        doc.getElementById('expense-value-input').value = '250';
        doc.getElementById('add-expense-btn').click();
        await new Promise(r => setTimeout(r, 200));
        const bannerHiddenAfterExpense = nudgeBanner ? win.getComputedStyle(nudgeBanner).display === 'none' : true;
        log('Gate 10.5: Adding an expense today suppresses the daily nudge banner', bannerHiddenAfterExpense);

        // Gate 10.6: PWA update notification function exists
        const hasUpdateNotifFn = typeof win.triggerUpdateNotification === 'function';
        log('Gate 10.6: PWA update notification handler registered', hasUpdateNotifFn);

        // Final evaluation
        const allPassed = results.every(r => r.passed);
        resultsDiv.setAttribute('data-status', allPassed ? 'PASSED' : 'FAILED');
        resultsDiv.className = allPassed ? 'pass' : 'fail';
        resultsDiv.textContent = allPassed ? `ALL ${results.length} RUNTIME CHECKS PASSED!` : `SOME CHECKS FAILED! Passed: ${results.filter(r => r.passed).length}/${results.length}`;

      } catch (err) {
        log('Exception in test suite', false, err.message + '\n' + err.stack);
        resultsDiv.setAttribute('data-status', 'FAILED');
        resultsDiv.className = 'fail';
        resultsDiv.textContent = 'EXCEPTION: ' + err.message;
      }
    }

    runSuite();
  </script>
</body>
</html>
