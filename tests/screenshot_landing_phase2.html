<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Phase 2 Screenshot Harness</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #09090b; }
    iframe { border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="phase2Frame" src="about:blank"></iframe>
  <script>
    const params = new URLSearchParams(window.location.search);
    const theme = params.get('theme') || 'dark';
    const section = params.get('section') || '';
    const step = params.get('step') || '';
    const tab = params.get('tab') || '';
    const reducedMotion = params.get('reduced_motion') === '1';
    const targetW = parseInt(params.get('width'), 10) || 1440;
    const targetH = parseInt(params.get('height'), 10) || 900;
    const frame = document.getElementById('phase2Frame');
    frame.style.width = targetW + 'px';
    frame.style.height = targetH + 'px';
    document.body.style.width = targetW + 'px';

    frame.onload = async () => {
      if (frame.src === 'about:blank' || frame.contentWindow.location.href === 'about:blank') return;
      const win = frame.contentWindow;
      const doc = frame.contentDocument;

      if (theme === 'light') {
        doc.documentElement.removeAttribute('data-theme');
      } else {
        doc.documentElement.setAttribute('data-theme', 'dark');
      }

      if (reducedMotion) {
        const style = doc.createElement('style');
        style.textContent = `
          *, *::before, *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
          }
          .walkthrough-stage-sticky { display: none !important; }
          .step-mobile-screen { display: block !important; }
          .manifesto-word { opacity: 1 !important; }
        `;
        doc.head.appendChild(style);
      }

      if (step) {
        if (win.__activateWalkthroughStep) {
          win.__activateWalkthroughStep(step);
        }
        const stepEl = doc.getElementById('walkthrough-step-' + step);
        if (stepEl) {
          stepEl.scrollIntoView({ behavior: 'instant', block: 'center' });
        }
      } else if (tab) {
        const tabEl = doc.getElementById('tab-' + tab);
        if (tabEl) {
          tabEl.click();
        }
        const targetSection = doc.getElementById('showcase');
        if (targetSection) {
          targetSection.scrollIntoView({ behavior: 'instant', block: 'start' });
        }
      } else if (section) {
        const targetSection = doc.getElementById(section);
        if (targetSection) {
          targetSection.scrollIntoView({ behavior: 'instant', block: 'start' });
        }
      }

      await new Promise(r => setTimeout(r, 600));
      window.__ready = true;
    };
    frame.src = '/index.html?t=' + Date.now();
  </script>
</body>
</html>
