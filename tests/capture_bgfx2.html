<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Living Background Screenshot Capture Harness</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #09090b;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="page-frame" src="about:blank"></iframe>
  <script>
    const params = new URLSearchParams(window.location.search);
    const pos = params.get('pos') || 'hero';
    const delay = parseInt(params.get('delay') || '400', 10);

    const frame = document.getElementById('page-frame');
    frame.src = '../index.html?t=' + Date.now();

    frame.onload = async () => {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;

      // Wait for landing ready
      await new Promise(r => {
        const check = () => {
          if (win.__ledgio_landingReady) setTimeout(r, 100);
          else setTimeout(check, 50);
        };
        check();
      });

      // Target section
      const secMap = {
        'hero': '#hero',
        'problem': '#problem',
        'steps': '#steps',
        'features': '#features',
        'faq': '#faq',
        'closing': '#closing-cta'
      };

      const sel = secMap[pos] || '#' + pos;
      const targetEl = doc.querySelector(sel);

      if (targetEl) {
        targetEl.scrollIntoView({ behavior: 'instant', block: 'start' });
      }

      // Settle appear elements in view
      doc.querySelectorAll('[data-appear]').forEach(el => {
        el.classList.add('is-appeared');
      });

      // Delay for sequence captures or animations
      if (delay > 0) {
        await new Promise(r => setTimeout(r, delay));
      }

      window.__capture_ready = true;
    };
  </script>
</body>
</html>
