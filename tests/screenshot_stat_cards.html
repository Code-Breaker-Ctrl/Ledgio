<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stat Cards Tap-to-Toggle Verification</title>
  <link rel="stylesheet" href="../assets/css/styles.min.css">
  <link rel="stylesheet" href="../assets/css/dashboard.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --color-bg: #0f172a;
      --color-surface: #1e293b;
      --color-text: #f8fafc;
      --color-text-muted: #94a3b8;
    }
    [data-theme="light"] {
      --color-bg: #f8fafc;
      --color-surface: #ffffff;
      --color-text: #0f172a;
      --color-text-muted: #64748b;
    }
    body {
      background: var(--color-bg);
      color: var(--color-text);
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }
    .demo-container {
      width: 100%;
      max-width: 720px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }
    body.mobile {
      padding: 8px;
    }
    body.mobile .demo-container {
      max-width: 100%;
      padding: 0;
    }
    .demo-header {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--color-text-muted);
      margin-bottom: 2px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      box-sizing: border-box;
      min-width: 0;
    }
    #demo-title {
      flex: 1;
      min-width: 0;
      word-break: break-word;
    }
    .badge-chip {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      width: 100%;
      box-sizing: border-box;
      min-width: 0;
    }
    body.mobile .summary-cards {
      gap: 8px !important;
    }
    .tap-counter-box {
      background: var(--color-surface);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.8rem;
      color: var(--color-text-muted);
      width: 100%;
      box-sizing: border-box;
      word-break: break-word;
    }
    [data-theme="light"] .tap-counter-box {
      border: 1px solid rgba(0,0,0,0.08);
    }
    .summary-card {
      background: var(--color-surface);
      border: 1px solid rgba(255,255,255,0.08);
    }
    [data-theme="light"] .summary-card {
      border: 1px solid rgba(0,0,0,0.08);
    }
  </style>
</head>
<body class="theme-dark">
  <div class="demo-container">
    <div class="demo-header">
      <span id="demo-title">Dashboard Stat Cards — Tap-to-Toggle</span>
      <span class="badge-chip" id="demo-mode-badge">Percentage View</span>
    </div>

    <!-- Summary Cards -->
    <div class="summary-cards">
      <div class="summary-card interactive-stat-card" id="summary-income-card" role="button" tabindex="0" aria-label="Income. Tap to toggle view." data-stat="income">
        <div class="card-icon income"><i class="fas fa-arrow-down"></i></div>
        <div class="card-info" style="min-width: 0; width: 100%;">
          <h3 id="summary-income-title">Income</h3>
          <p id="summary-income" style="margin: 4px 0; font-size: 1.5rem; font-weight: 700;"><span style="color: var(--color-success, #10b981); font-weight: 700;">55%</span></p>
          <span id="summary-income-lifetime" class="summary-card-subtext" style="font-size: 0.75rem; color: var(--color-text-muted); display: block; margin-top: 2px;">of income saved this month<br>Total earned ₹16,540</span>
        </div>
      </div>

      <div class="summary-card interactive-stat-card" id="summary-expenses-card" role="button" tabindex="0" aria-label="Expenses. Tap to toggle view." data-stat="expenses">
        <div class="card-icon expenses"><i class="fas fa-arrow-up"></i></div>
        <div class="card-info" style="min-width: 0; width: 100%;">
          <h3 id="summary-expenses-title">Expenses</h3>
          <p id="summary-expenses" style="margin: 4px 0; font-size: 1.5rem; font-weight: 700;"><span style="color: var(--color-danger, #f43f5e); font-weight: 700;">45%</span></p>
          <span id="summary-expenses-spend-percent" class="summary-card-subtext" style="font-size: 0.75rem; color: var(--color-text-muted); display: block; margin-top: 2px;">of income spent this month<br>Total spent ₹2,289</span>
        </div>
      </div>
    </div>

    <div class="tap-counter-box" id="tap-info">
      <strong>Tap Status:</strong> Ready. Click/tap either card to toggle between % and ₹ independently.
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode') || 'desktop-dark';
    const targetView = params.get('view') || 'percent'; // 'percent' or 'rupee'

    if (mode.includes('light')) {
      document.documentElement.setAttribute('data-theme', 'light');
      document.body.classList.remove('theme-dark');
      document.body.classList.add('theme-light');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.body.classList.add('theme-dark');
      document.body.classList.remove('theme-light');
    }

    if (mode.includes('mobile')) {
      document.body.classList.add('mobile');
    }

    const incCard = document.getElementById('summary-income-card');
    const expCard = document.getElementById('summary-expenses-card');
    const incBig = document.getElementById('summary-income');
    const incSub = document.getElementById('summary-income-lifetime');
    const expBig = document.getElementById('summary-expenses');
    const expSub = document.getElementById('summary-expenses-spend-percent');
    const infoBox = document.getElementById('tap-info');
    const badge = document.getElementById('demo-mode-badge');

    let currentModes = {
      income: 'percent',
      expenses: 'percent'
    };

    function renderView() {
      // Income card
      if (currentModes.income === 'percent') {
        incBig.innerHTML = '<span style="color: var(--color-success, #10b981); font-weight: 700;">55%</span>';
        incSub.innerHTML = 'of income saved this month<br>Total earned ₹16,540';
      } else {
        incBig.textContent = '₹5,080.00';
        incSub.textContent = 'Total earned ₹16,540';
      }

      // Expenses card
      if (currentModes.expenses === 'percent') {
        expBig.innerHTML = '<span style="color: var(--color-danger, #f43f5e); font-weight: 700;">45%</span>';
        expSub.innerHTML = 'of income spent this month<br>Total spent ₹2,289';
      } else {
        expBig.textContent = '₹2,289.00';
        expSub.textContent = 'Total spent ₹2,289';
      }

      const allRupee = currentModes.income === 'rupee' && currentModes.expenses === 'rupee';
      const allPct = currentModes.income === 'percent' && currentModes.expenses === 'percent';
      if (allRupee) {
        badge.textContent = 'Rupee View (Toggled)';
      } else if (allPct) {
        badge.textContent = 'Percentage View (Default)';
      } else {
        badge.textContent = `Mixed View (${currentModes.income.toUpperCase()} / ${currentModes.expenses.toUpperCase()})`;
      }
    }

    function toggleCard(type) {
      currentModes[type] = currentModes[type] === 'percent' ? 'rupee' : 'percent';
      const card = type === 'income' ? incCard : expCard;
      if (card) {
        card.classList.add('toggling');
        renderView();
        setTimeout(() => card.classList.remove('toggling'), 150);
      } else {
        renderView();
      }
    }

    incCard.addEventListener('click', () => toggleCard('income'));
    expCard.addEventListener('click', () => toggleCard('expenses'));

    // Apply requested initial view
    if (targetView === 'rupee') {
      currentModes.income = 'rupee';
      currentModes.expenses = 'rupee';
      renderView();
    }

    // Tap 5x simulation if requested
    if (params.get('tap5x') === 'true') {
      (async () => {
        for (let i = 1; i <= 5; i++) {
          toggleCard('income');
          await new Promise(r => setTimeout(r, 60));
          toggleCard('expenses');
          await new Promise(r => setTimeout(r, 60));
        }
        infoBox.innerHTML = `<strong>Tap 5x Verified:</strong> Both cards tapped 5 times smoothly without jank. State: Income=${currentModes.income}, Expenses=${currentModes.expenses}`;
      })();
    } else {
      infoBox.innerHTML = `<strong>Display:</strong> ${targetView.toUpperCase()} view · Independent toggle active · Min 44px touch target · 180ms smooth transition.`;
    }
  </script>
</body>
</html>
